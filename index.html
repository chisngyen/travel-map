<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Roam</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Roam">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
:root {
  --ink: #1f2933; --muted: #6b7280; --faint: #9ca3af; --line: #e5e7eb; --bg: #ffffff; --soft: #f5f6f7;
  --accent: #1f2933; --warn: #b45309; --warn-bg: #fef3c7;
  --top: 0px; --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: "Be Vietnam Pro", system-ui, sans-serif; color: var(--ink); background: var(--soft); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#map { position: fixed; inset: 0; }

/* ---------- top bar */
#top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line);
       padding-top: env(safe-area-inset-top, 0px); }
#bar { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px; }
#pick { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 16px; min-width: 0; padding: 6px 0; }
#pick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pick svg { transform: rotate(180deg); width: 18px; height: 18px; color: var(--muted); }
#sub { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.row { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 0 12px; }
.row::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 8px 12px 9px; border-bottom: 3px solid transparent; color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
.tab b { display: block; font-size: 14px; font-weight: 600; color: var(--ink); }
.tab small { font-size: 12px; }
.tab.on { border-bottom-color: var(--c, var(--ink)); color: var(--ink); }
.tab.on b { color: var(--c, var(--ink)); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 12px 10px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg);
        font-size: 13px; font-weight: 500; white-space: nowrap; }
.em { font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; line-height: 1; }
.chip .em { font-size: 17px; }
.chip > svg.i { width: 14px; height: 14px; }
.chip.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.chip.off { opacity: .45; }

/* ---------- menu (chon trip / kho) */
#menu { position: fixed; inset: 0; z-index: 30; background: rgba(17, 24, 39, .35); display: none; }
#menu.open { display: block; }
#menu .box { background: var(--bg); padding-top: env(safe-area-inset-top, 0px); max-height: 80vh; overflow-y: auto; }
#menu h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 14px 16px 6px; }
#menu button.it { display: flex; width: 100%; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 12px; align-items: baseline; }
#menu button.it b { font-weight: 600; }
#menu button.it small { color: var(--muted); margin-left: auto; white-space: nowrap; }
#menu button.it.on { background: var(--soft); box-shadow: inset 3px 0 0 var(--ink); }

/* ---------- bottom sheet */
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 86vh; background: var(--bg); border-top: 1px solid var(--line);
         box-shadow: 0 -2px 12px rgba(0,0,0,.08); display: flex; flex-direction: column; transition: transform .28s cubic-bezier(.2,.8,.2,1); will-change: transform; }
#sheet.drag { transition: none; }
#grab { flex: none; padding: 8px 16px 10px; touch-action: none; cursor: grab; }
#grab::before { content: ""; display: block; width: 36px; height: 4px; background: #d1d5db; margin: 0 auto 10px; }
#head { display: flex; align-items: baseline; gap: 10px; }
#head h2 { font-size: 16px; font-weight: 600; line-height: 1.3; }
#head .meta { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
#headsub { color: var(--muted); font-size: 13px; margin-top: 2px; display: flex; gap: 12px; flex-wrap: wrap; }
#headsub a { color: var(--ink); font-weight: 500; text-decoration: none; border-bottom: 1px solid var(--ink); }
#list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(24px + var(--safe-b)); }

/* timeline */
.stop { display: grid; grid-template-columns: 48px 28px 1fr; column-gap: 10px; padding: 0 16px; position: relative; }
.stop .t { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; padding-top: 12px; text-align: right; }
.stop .t small { display: block; font-weight: 400; color: var(--faint); }
.stop .rail { position: relative; display: flex; justify-content: center; }
.stop .rail::before { content: ""; position: absolute; top: 0; height: 12px; width: 3px; background: var(--c); }
.stop .rail::after { content: ""; position: absolute; top: 36px; bottom: 0; width: 3px; background: var(--n, transparent); }
.stop:first-child .rail::before, .nowbar + .stop .rail::before { display: none; }
.num { position: relative; margin-top: 10px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--c); color: #fff;
       font-size: 13px; font-weight: 700; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--c); }
.num.home { background: #fff; border: 2px solid var(--hc); box-shadow: none; width: 30px; height: 30px; margin-top: 8px; }
.num.home .em { font-size: 16px; }
.body { padding: 10px 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.stop.last .body { border-bottom: 0; }
.body .nm { font-weight: 600; font-size: 15px; }
.body .ty { color: var(--muted); font-size: 13px; }
.body .do { margin-top: 3px; font-size: 14px; }
.leg { color: var(--ink); font-size: 13px; font-weight: 500; margin-top: 2px; }
.gap { grid-column: 3; font-size: 12px; color: #3f6212; background: #eef4ec; padding: 3px 8px; margin: 6px 0 0; display: inline-block; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.tag.w { background: var(--warn-bg); color: var(--warn); }
.tag.fx { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.more { display: none; margin-top: 8px; font-size: 14px; }
.open .more { display: block; }
.open .body { background: linear-gradient(90deg, transparent, transparent); }
.more ul { padding-left: 18px; margin: 6px 0; }
.more li { margin: 2px 0; }
.kv { display: grid; grid-template-columns: 78px 1fr; gap: 3px 8px; font-size: 13px; margin: 6px 0; }
.kv dt { color: var(--muted); }
.note { font-size: 13px; background: var(--soft); padding: 6px 8px; margin: 6px 0; border-left: 3px solid var(--line); }
.note.w { background: var(--warn-bg); border-left-color: var(--warn); color: #78350f; }
.tl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 8px 0; font-size: 13.5px; }
.tl b { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.rides { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 8px; }
.rides span { font-size: 12.5px; padding: 2px 7px; border: 1px solid var(--line); background: var(--soft); }
.sec { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-top: 10px; }
.op { font-size: 12.5px; font-weight: 600; }
.op.on { color: #2f9e44; } .op.soon { color: #b45309; } .op.off { color: #c92a2a; }
.mt { font-size: 13.5px; margin: 4px 0 6px; }
.nowbar { margin: 4px 16px 6px; padding: 9px 12px; background: var(--soft); border-left: 3px solid var(--ink); font-size: 14px; }
.nowbar small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.stop.now .body { box-shadow: inset 0 -2px 0 var(--c); }
.stop.now .t { color: var(--c); }
#pickbar { display: none; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 16px 10px; border-bottom: 1px solid var(--line); }
#pickbar.on { display: flex; }
#pickbar b { font-size: 14px; margin-right: auto; }
.btn.sm { padding: 6px 10px; font-size: 12.5px; }
.pk.on { background: var(--soft); }
.ord { display: inline-block; min-width: 18px; padding: 0 4px; margin-right: 6px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; text-align: center; vertical-align: 2px; }
.acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--ink); }
.btn.pri { background: var(--ink); color: #fff; }

/* kho list */
.pl { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.pl .sw { width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid; background: #fff; }
.pl .sw .em { font-size: 19px; }
.pl .nm { font-weight: 600; }
.pl .ty { color: var(--muted); font-size: 13px; }
.pl .r { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }
.pl .r b { display: block; color: var(--ink); font-size: 14px; font-weight: 700; }
.pl .more { grid-column: 2 / 4; }
.empty { padding: 24px 16px; color: var(--muted); }

/* markers */
.mk { width: 28px; height: 28px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer; transition: transform .15s; }
.mk.home { background: #fff; border: 3px solid; width: 34px; height: 34px; }
.mk.home .em { font-size: 19px; }
.mk.sel { transform: scale(1.3); z-index: 5; }
.maplibregl-ctrl-group { border-radius: 0 !important; box-shadow: 0 1px 4px rgba(0,0,0,.2) !important; }
.maplibregl-ctrl-group button { width: 40px; height: 40px; }
.maplibregl-ctrl-top-right { top: var(--top); }
.maplibregl-ctrl-attrib { font-size: 10px; }
.maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { display: none; }

@media (min-width: 900px) {
  #sheet { left: 0; right: auto; top: var(--top); width: 400px; height: auto; border-top: 0; border-right: 1px solid var(--line); transform: none !important; box-shadow: none; }
  #grab::before { display: none; }
  #map { left: 400px; }
  .maplibregl-ctrl-bottom-right { display: block; }
}
</style>
</head>
<body>
<div id="map"></div>
<header id="top">
  <div id="bar"><button id="pick"><span id="pickt"></span></button><div id="sub"></div></div>
  <div id="tabs" class="row"></div>
  <div id="cities" class="chips"></div>
  <div id="types" class="chips"></div>
</header>
<div id="menu"><div class="box" id="menubox"></div></div>
<section id="sheet">
  <div id="grab"><div id="head"><h2 id="htitle"></h2><span class="meta" id="hmeta"></span></div><div id="headsub"></div></div>
  <div id="pickbar"></div>
  <div id="list"></div>
</section>

const DAYN = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
const DAYFULL = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
// trang thai mo cua tinh theo dong ho dien thoai (lich tuan wk lay tu gio Google luc luu quan)
function openInfo(p, at = new Date()) {
  if (!p.wk) return null;
  const day = (at.getDay() + 6) % 7, m = at.getHours() * 60 + at.getMinutes();
  for (const [a, b] of p.wk[(day + 6) % 7]) if (b <= a && m < b) return { open: true, close: b, soon: b - m <= 30 };
  for (const [a, b] of p.wk[day]) {
    const end = b <= a ? b + 1440 : b;
    if (m >= a && m < end) return { open: true, close: b, soon: end - m <= 30 };
  }
  const later = p.wk[day].map(r => r[0]).filter(a => a > m).sort((x, y) => x - y)[0];
  if (later != null) return { open: false, next: hm(later) };
  for (let k = 1; k <= 7; k++) {
    const r = p.wk[(day + k) % 7];
    if (r.length) return { open: false, next: (k === 1 ? "mai " : DAYN[(day + k) % 7] + " ") + hm(Math.min(...r.map(x => x[0]))) };
  }
  return { open: false, next: "" };
}
function openLabel(p) {
  const o = openInfo(p);
  if (!o) return "";
  return o.open ? `<span class="op ${o.soon ? "soon" : "on"}">${o.soon ? "Sắp đóng" : "Đang mở"}, đóng ${hm(o.close)}</span>`
                : `<span class="op off">Đã đóng${o.next ? ", mở " + o.next : ""}</span>`;
}
// metro: ga gan nhat + cach di (di bo ~15 phut/km duong chim bay, ~2,3 phut moi ga, cho tau ~5 phut)
function nearestSt(pt) {
  const M = DATA.metro; if (!M) return null;
  let best = null;
  M.stations.forEach((s, i) => { const d = km(pt, [s[2], s[1]]); if (!best || d < best.d) best = { i, name: s[0], d }; });
  return best;
}
function metroHint(p) {
  const B = nearestSt([p.lng, p.lat]);
  if (!B || B.d > 1.5) return "";
  const A = S.me ? nearestSt(S.me) : null;
  let h = `<div class="sec">Metro số 1</div><div class="mt">`;
  if (A && A.d <= 1.5 && A.i !== B.i) {
    const n = Math.abs(A.i - B.i), dir = B.i < A.i ? "Bến Thành" : "Suối Tiên";
    const tot = Math.round(A.d * 15 + 5 + n * 2.3 + B.d * 15);
    h += `Đi bộ ${dist(A.d)} tới ga <b>${esc(A.name)}</b>, lên tàu hướng ${dir}, đi ${n} ga tới ga <b>${esc(B.name)}</b>, rồi đi bộ ${dist(B.d)}. Tổng khoảng ${tot} phút.`;
  } else {
    h += `Ga gần nhất: <b>${esc(B.name)}</b>, đi bộ ${dist(B.d)} (khoảng ${Math.max(1, Math.round(B.d * 15))} phút).`;
  }
  return h + `</div>`;
}

// ---------------------------------------------------------------- state <-> hash
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("t")) { const t = DATA.trips.find(x => x.id === h.get("t")); if (t) { S.mode = "trip"; S.trip = t; S.day = Math.max(0, Math.min(t.days.length - 1, (+h.get("d") || 1) - 1)); return true; } }
  if (h.has("kho")) { S.mode = "kho"; S.city = h.get("c") || null; return true; }
  return false;
}
function writeHash() {
  const h = S.mode === "trip" ? `t=${S.trip.id}&d=${S.day + 1}` : `kho${S.city ? "&c=" + S.city : ""}`;
  history.replaceState(null, "", "#" + h);
}
function autoPick() {
  for (const t of DATA.trips) {
    const i = t.days.findIndex(d => d.date === todayISO);
    if (i >= 0) { S.mode = "trip"; S.trip = t; S.day = i; return; }
  }
  const soon = DATA.trips.filter(t => t.start && t.start >= todayISO && (new Date(t.start) - new Date(todayISO)) / 864e5 <= 14)
                         .sort((a, b) => a.start.localeCompare(b.start))[0];
  if (soon) { S.mode = "trip"; S.trip = soon; S.day = 0; return; }
  S.mode = "kho";
}

// ---------------------------------------------------------------- icons -> map images
// ghim = o vuong trang, vien mau theo loai, emoji he thong (iPhone ra emoji Apple, Android ra emoji Google)
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function iconImage(type, size = 34) {
  const r = 2, px = size * r, s = st(type);
  const c = document.createElement("canvas"); c.width = c.height = px;
  const g = c.getContext("2d");
  g.fillStyle = s.color; g.fillRect(0, 0, px, px);
  g.fillStyle = "#ffffff"; g.fillRect(3 * r, 3 * r, px - 6 * r, px - 6 * r);
  g.font = `${Math.round(px * 0.56)}px ${EMOJI_FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(s.emoji, px / 2, px / 2 + px * 0.04);
  return { width: px, height: px, data: g.getImageData(0, 0, px, px).data };
}
const em = t => `<span class="em">${st(t).emoji}</span>`;
function squareImage(px, fill) {
  const c = document.createElement("canvas"); c.width = c.height = px;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, px, px); g.fillStyle = fill; g.fillRect(4, 4, px - 8, px - 8);
  return { width: px, height: px, data: g.getImageData(0, 0, px, px).data };
}

function clearMarkers() { markers.forEach(m => m.remove()); markers = []; }
function addMarker(p, html, color, key, onClick, home = false) {
  const el = document.createElement("div"); el.className = "mk" + (home ? " home" : ""); el.dataset.key = key; el.innerHTML = html;
  if (home) el.style.borderColor = color; else el.style.background = color;
  el.addEventListener("click", ev => { ev.stopPropagation(); onClick(); });
  const m = new maplibregl.Marker({ element: el }).setLngLat([p.lng, p.lat]).addTo(map); markers.push(m); return m;
}
function padding() {
  const top = $("#top").offsetHeight + 16;
  if (innerWidth >= 900) return { top, bottom: 40, left: 40, right: 60 };
  return { top, bottom: Math.round(innerHeight * HALF) + 36, left: 40, right: 56 };
}
function fit(pts) {
  if (!pts.length) return;
  if (pts.length === 1) { map.easeTo({ center: pts[0], zoom: 15, padding: padding() }); return; }
  const b = new maplibregl.LngLatBounds(pts[0], pts[0]); pts.forEach(p => b.extend(p));
  map.fitBounds(b, { padding: padding(), maxZoom: 15.5, duration: 600 });
}

    $("#cities").querySelectorAll(".chip").forEach(b => b.onclick = () => {

  if (p.best && !trip) kv.push(["Giờ đẹp", esc(p.best)]);
  if (p.phone) kv.push(["SĐT", `<a href="tel:${esc(p.phone.replace(/\s/g, ""))}">${esc(p.phone)}</a>`]);

  if (p.highlights) h += `<ul>${p.highlights.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;

  if (p.warn) h += p.warn.map(w => `<div class="note w">${esc(w)}</div>`).join("");
  if (p.unchecked) h += `<div class="note w">Chưa soát: kiểm tên, địa chỉ, giờ trên Google Maps trước khi đi</div>`;
  if (p.alt) h += `<div class="note">Thay thế: ${esc(p.alt)}</div>`;
  if (p.tips && !trip) h += `<div class="note">Mẹo: ${esc(p.tips)}</div>`;

}

// ---------------------------------------------------------------- trip view
function nowBar(D) {
  if (S.mode !== "trip" || D.date !== todayISO || !D.stops.length) return { html: "", cur: -1 };
  const m = nowMin();
  const cur = D.stops.findIndex(s => toMin(s.start) <= m && m < toMin(s.end));
  const nx = D.stops.findIndex(s => toMin(s.start) > m);
  let h;
  if (cur >= 0) {
    const s = D.stops[cur], tm = (s.times || []).find(x => x.t && toMin(x.t.split("-")[0]) > m);
    h = `Đang ở <b>${esc(s.name)}</b>, tới ${s.end}` + (tm ? `<small>Mốc kế: ${esc(tm.t)} ${esc(tm.x)}</small>` : nx >= 0 ? `<small>Tiếp theo: ${D.stops[nx].start} ${esc(D.stops[nx].name)}</small>` : "");
  } else if (nx >= 0) {
    const s = D.stops[nx], left = toMin(s.start) - m;
    h = `Tiếp theo <b>${s.start} ${esc(s.name)}</b><small>Còn ${left >= 60 ? Math.floor(left / 60) + " giờ " : ""}${left % 60} phút${s.travel ? ", đi mất " + esc(s.travel) : ""}</small>`;
  } else h = "Xong lịch hôm nay";
  return { html: `<div class="nowbar">${h}</div>`, cur: cur >= 0 ? cur : nx };
}
function renderTrip(refit) {
  const D = curDay();
  map.getSource("kho").setData({ type: "FeatureCollection", features: [] });
  map.getSource("route").setData({ type: "FeatureCollection", features: (D.legs || []).map(l => ({ type: "Feature", properties: { c: l.c, home: l.to === null }, geometry: { type: "LineString", coordinates: l.g } })) });
  clearMarkers();
  const pts = [];
  const homes = [];
  if (D.from) homes.push(["from", D.from]);
  if (D.to && (!D.from || D.to.id !== D.from.id)) homes.push(["to", D.to]);
  homes.forEach(([k, p]) => { addMarker(p, em(p.type), st(p.type).color, k, () => selectStop(k, false), true); pts.push([p.lng, p.lat]); });
  D.stops.forEach((s, i) => { addMarker(s, String(i + 1), s.color, "s" + i, () => selectStop("s" + i, false)); pts.push([s.lng, s.lat]); });

  $("#htitle").textContent = S.mode === "plan" ? "Lộ trình tự chọn" : `Ngày ${D.n}${D.date ? ", " + dlabel(D.date) : ""}`;
  $("#hmeta").textContent = `${D.km}, ô tô ${D.drive}`;
  $("#headsub").innerHTML = `<span>${esc(D.title)}</span><a href="${esc(D.link)}" target="_blank" rel="noopener">Mở cả tuyến</a>`;

  const nb = nowBar(D);
  const rows = [nb.html];
  const HOME = "#495057";
  const homeRow = (k, p, label, time) => `<div class="stop${k === "to" ? " last" : ""}${S.sel === k ? " open" : ""}" data-k="${k}" style="--c:${HOME};${k === "from" && D.stops[0] ? "--n:" + D.stops[0].color : ""}">
      <div class="t">${time || ""}</div><div class="rail"><div class="num home" style="--hc:${st(p.type).color}">${em(p.type)}</div></div>
      <div class="body"><div class="nm">${esc(p.name)}</div><div class="ty">${label}</div>${k === "to" && D.backLeg ? `<div class="leg">Ô tô ${esc(D.backLeg)}</div>` : ""}${details(p, { trip: true })}</div></div>`;
  if (D.from) rows.push(homeRow("from", D.from, D.from.id === "@me" ? "Bạn đang ở đây" : D.from.type === "ben-xe" ? "Xuống xe, xuất phát" : "Xuất phát", D.from.id === "@me" ? hm(nowMin()) : ""));
  D.stops.forEach((s, i) => {
    const tags = (s.fixed ? `<span class="tag fx">hẹn ${esc(s.fixed)}</span>` : "") + (s.warn || s.unchecked ? `<span class="tag w">lưu ý</span>` : "");
    const nxt = D.stops[i + 1] ? D.stops[i + 1].color : D.to ? HOME : "transparent";
    rows.push(`<div class="stop${!D.to && i === D.stops.length - 1 ? " last" : ""}${S.sel === "s" + i ? " open" : ""}${nb.cur === i ? " now" : ""}" data-k="s${i}" style="--c:${s.color};--n:${nxt}">
      <div class="t">${s.start}<small>${s.end}</small></div><div class="rail"><div class="num">${i + 1}</div></div>
      <div class="body">${s.wait ? `<div class="gap">Trống ${esc(s.wait)}</div>` : ""}
        <div class="nm">${esc(s.name)}${tags}</div>
        <div class="ty">${esc(s.typeName)}</div>${s.travel ? `<div class="leg">Ô tô ${esc(s.travel)}${s.km ? ", " + esc(s.km) : ""}</div>` : ""}
        ${s.do ? `<div class="do">${esc(s.do)}</div>` : ""}${details(s, { trip: true })}</div></div>`);
  });
  if (D.to) rows.push(homeRow("to", D.to, D.to.type === "ben-xe" ? "Ra bến xe" : D.from && D.to.id === D.from.id ? "Về chỗ ở" : "Về chỗ ở mới", D.back));
  $("#list").innerHTML = rows.join("");
  $("#list").querySelectorAll(".stop").forEach(el => el.onclick = e => { if (!e.target.closest("a,button")) selectStop(el.dataset.k, true); });
  if (refit) fit(pts);
}
function selectStop(k, fromList) {
  const D = curDay();
  const p = k === "from" ? D.from : k === "to" ? (D.to.id === D.from?.id ? D.from : D.to) : D.stops[+k.slice(1)];
  if (!p) return;
  const was = S.sel === k; S.sel = was && fromList ? null : k;
  document.querySelectorAll(".stop").forEach(el => el.classList.toggle("open", el.dataset.k === S.sel || (S.sel === "to" && el.dataset.k === "to")));
  markers.forEach(m => m.getElement().classList.toggle("sel", m.getElement().dataset.key === S.sel || (S.sel === "to" && D.to?.id === D.from?.id && m.getElement().dataset.key === "from")));
  if (!S.sel) return;
  map.easeTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 15), padding: padding(), duration: 500 });
  const el = $(`.stop[data-k="${S.sel}"]`);
  if (!fromList) setSheet(Math.min(sheetPos, 1));
  el && setTimeout(() => el.scrollIntoView({ block: "nearest", behavior: "smooth" }), 280);
}

// ---------------------------------------------------------------- kho view
function filtered() {
  return DATA.places.filter(p => (!S.city || p.citySlug === S.city) && (S.types.size === 0 || S.types.has(p.type)) &&
                               (!S.openOnly || openInfo(p)?.open !== false));
}
function nearMe() {
  S.near = true; S.city = null; S.mode = "kho";
  renderTop(); renderKho(false);
  if (S.me) { S.hold = true; map.easeTo({ center: S.me, zoom: 13.6, padding: padding(), duration: 600 }); }
  else geo.trigger();
}
function renderKho(refit) {
  clearMarkers();
  map.getSource("route").setData({ type: "FeatureCollection", features: [] });
  const ps = filtered();
  map.getSource("kho").setData({ type: "FeatureCollection", features: ps.map(p => ({ type: "Feature", properties: { id: p.id, type: p.type, name: p.name, closed: openInfo(p)?.open === false }, geometry: { type: "Point", coordinates: [p.lng, p.lat] } })) });
  if (refit && !S.near) { S.hold = true; fit(ps.map(p => [p.lng, p.lat])); }
  renderKhoList();
}
// danh sach = cac cho dang nam trong khung ban do, gan nhat truoc (tinh tu vi tri cua minh, chua dinh vi thi tu giua ban do)
function renderKhoList() {
  const b = map.getBounds(), c = map.getCenter();
  const fromMe = !!S.me, ref = S.me || [c.lng, c.lat];
  const all = filtered().filter(p => b.contains([p.lng, p.lat]));
  all.forEach(p => { p._k = km(ref, [p.lng, p.lat]); p._d = fromMe ? p._k : null; });
  const order = all.sort((a, b) => a._k - b._k).slice(0, 80);
  const cityName = S.near ? "Gần tôi" : S.city ? DATA.places.find(p => p.citySlug === S.city).city : "Mọi nơi";
  $("#htitle").textContent = cityName;
  $("#hmeta").textContent = `${all.length} chỗ trong khung`;
  $("#headsub").innerHTML = `<span>${fromMe ? "Số km tính từ chỗ bạn đứng, gần nhất xếp trước" : "Chưa có vị trí của bạn: bấm Gần tôi để hiện số km"}</span>` +
    (S.types.size ? `<span>${[...S.types].map(t => esc(DATA.places.find(p => p.type === t)?.typeName || t)).join(", ")}</span>` : "");
  $("#list").innerHTML = order.length ? order.map(p => `<div class="pl${p.id === S.sel ? " open" : ""}" data-id="${esc(p.id)}">
      <div class="sw" style="border-color:${st(p.type).color}">${em(p.type)}</div>
      <div><div class="nm">${S.pick.includes(p.id) ? `<span class="ord">${S.pick.indexOf(p.id) + 1}</span>` : ""}${esc(p.name)}</div><div class="ty">${esc(p.typeName)}${p.area ? ", " + esc(p.area) : ""}${(st => st && st.d <= 1 ? `, ga ${esc(st.name)} ${dist(st.d)}` : "")(nearestSt([p.lng, p.lat]))}</div>${openLabel(p) ? `<div>${openLabel(p)}</div>` : ""}</div>
      <div class="r">${p._d != null ? `<b>${dist(p._d)}</b>` : ""}${p.status === "da-di" ? "<div>Đã đi</div>" : ""}</div>
      ${details(p)}</div>`).join("") : `<div class="empty">Khung bản đồ này chưa có chỗ nào${S.types.size ? " thuộc loại đang lọc" : ""}. Kéo hoặc thu nhỏ bản đồ.</div>`;
  $("#list").querySelectorAll(".pl").forEach(el => el.onclick = e => { if (!e.target.closest("a,button")) selectPlace(el.dataset.id, true); });
  $("#sub").textContent = `${filtered().length} chỗ`;
}
function selectPlace(id, fromList) {
  const was = S.sel === id; S.sel = was && fromList ? null : id;
  document.querySelectorAll(".pl").forEach(el => el.classList.toggle("open", el.dataset.id === S.sel));
  map.setLayoutProperty("kho-pt", "icon-size", ["case", ["==", ["get", "id"], S.sel || ""], 1.35, 1]);
  if (!S.sel) return;
  const p = DATA.places.find(x => x.id === id);
  S.hold = true;  // chi keo ban do toi quan, khong zoom sat (zoom sat thi danh sach co lai, khong chon tiep duoc)
  map.easeTo({ center: [p.lng, p.lat], zoom: map.getZoom() < 12.5 ? 14 : map.getZoom(), padding: padding(), duration: 500 });
  const el = $(`.pl[data-id="${CSS.escape(id)}"]`);
  if (!fromList) { setSheet(Math.min(sheetPos, 1)); }
  el && setTimeout(() => el.scrollIntoView({ block: fromList ? "nearest" : "start", behavior: "smooth" }), 280);
}

// ---------------------------------------------------------------- chon nhieu cho -> xep thu tu (OSRM, thu moi thu tu) / hoi ChatGPT
function togglePick(id) {
  const i = S.pick.indexOf(id);
  if (i >= 0) S.pick.splice(i, 1); else if (S.pick.length < 8) S.pick.push(id);
  renderPickbar();
  if (S.mode === "kho") renderKhoList();
}
function renderPickbar() {
  const bar = $("#pickbar");
  if (S.mode === "plan") {
    bar.innerHTML = `<b>${S.plan.stops.length} chỗ, đã xếp thứ tự</b><a class="btn sm" href="${gptUrl()}" target="_blank" rel="noopener">Hỏi ChatGPT</a><button class="btn sm" data-act="back">Về kho</button>`;
  } else if (S.mode === "kho" && S.pick.length) {
    bar.innerHTML = `<b>Đã chọn ${S.pick.length} chỗ</b><button class="btn sm pri" data-act="plan">Xếp thứ tự</button><a class="btn sm" href="${gptUrl()}" target="_blank" rel="noopener">Hỏi ChatGPT</a><button class="btn sm" data-act="clear">Bỏ hết</button>`;
  } else { bar.className = ""; bar.innerHTML = ""; return; }
  bar.className = "on";
  bar.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "plan") { b.textContent = "Đang xếp..."; planPick(); }
    if (a === "clear") { S.pick = []; renderPickbar(); renderKhoList(); }
    if (a === "back") { S.mode = "kho"; S.sel = null; render(true); }
  });
}
function gptText() {
  const ps = S.mode === "plan" ? S.plan.stops : S.pick.map(id => DATA.places.find(p => p.id === id));
  const d = new Date();
  let t = `Mình đang ${S.me ? `ở toạ độ ${S.me[1].toFixed(5)}, ${S.me[0].toFixed(5)}` : "ở ngoài đường"}, bây giờ là ${hm(nowMin())} ${DAYFULL[d.getDay()]}. ` +
          `Mình muốn đi các chỗ dưới đây trong hôm nay, đi ô tô, hoặc metro số 1 (Bến Thành - Suối Tiên) nếu tiện hơn:\n`;
  ps.forEach((p, i) => {
    const o = openInfo(p), B = nearestSt([p.lng, p.lat]);
    t += `${i + 1}. ${p.name} (${p.typeName})${p.address ? ", " + p.address : ""}. Giờ mở: ${p.hours || "chưa rõ"}` +
         `${o ? (o.open ? ", đang mở" : ", đang đóng") : ""}${B && B.d <= 1.5 ? `. Gần ga metro ${B.name} (${dist(B.d)})` : ""}.\n`;
  });
  return t + `Xếp giúp mình thứ tự đi hợp lý (tính giờ mở cửa, giờ ăn, kẹt xe), mỗi chặng nói đi bằng gì, mất bao lâu, và giờ dự kiến tới từng chỗ.`;
}
const gptUrl = () => "https://chatgpt.com/?q=" + encodeURIComponent(gptText());
async function osrmTable(pts) {
  try {
    const r = await fetch(`https://router.project-osrm.org/table/v1/driving/${pts.map(p => p.lng + "," + p.lat).join(";")}?annotations=duration,distance`);
    const j = await r.json();
    if (j.code === "Ok") return { t: j.durations.map(r => r.map(x => x / 60 + 5)), d: j.distances.map(r => r.map(x => x / 1000)) };
  } catch (e) {}
  const d = pts.map(a => pts.map(b => km([a.lng, a.lat], [b.lng, b.lat]) * 1.35));
  return { d, t: d.map(r => r.map(x => x / 28 * 60 + 5)) };
}
async function osrmLeg(a, b) {
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
    const j = await r.json();
    if (j.code === "Ok") return j.routes[0].geometry.coordinates;
  } catch (e) {}
  return [[a.lng, a.lat], [b.lng, b.lat]];
}
async function planPick() {
  const ps = S.pick.map(id => DATA.places.find(p => p.id === id)).filter(Boolean);
  const me = S.me ? { id: "@me", name: "Vị trí của tôi", type: "me", typeName: "Vị trí của tôi", lng: S.me[0], lat: S.me[1] } : null;
  const pts = (me ? [me] : []).concat(ps), off = me ? 1 : 0, STAY = 45, t0 = nowMin();
  const M = await osrmTable(pts);
  const at = m => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setMinutes(m); return d; };
  const sim = order => {
    let t = t0, cur = me ? 0 : null, cost = 0;
    const out = order.map(i => {
      const tr = cur === null ? 0 : M.t[cur][i + off];
      t += tr; cost += tr;
      const o = openInfo(ps[i], at(t)), closed = o && !o.open;
      if (closed) cost += 120;
      const row = { i, start: t, end: t + STAY, tr, km: cur === null ? 0 : M.d[cur][i + off], closed };
      t += STAY; cur = i + off; return row;
    });
    return { cost, out };
  };
  let best = null;
  const perm = (a, k) => {
    if (k === a.length) { const r = sim(a); if (!best || r.cost < best.cost) best = r; return; }
    for (let j = k; j < a.length; j++) { [a[k], a[j]] = [a[j], a[k]]; perm(a, k + 1); [a[k], a[j]] = [a[j], a[k]]; }
  };
  perm(ps.map((_, i) => i), 0);
  const stops = best.out.map((r, n) => ({ ...ps[r.i], start: hm(r.start), end: hm(r.end), color: LEG[n % LEG.length],
    travel: r.tr ? `${Math.round(r.tr)} phút` : "", km: r.km ? dist(r.km) : "", warn: r.closed ? ["Lúc tới có thể quán đang đóng, xem giờ mở"] : undefined }));
  const seq = (me ? [me] : []).concat(stops);
  const legs = await Promise.all(seq.slice(1).map((b, j) => osrmLeg(seq[j], b).then(g => ({ to: j, c: b.color, g }))));
  const ll = p => `${p.lat},${p.lng}`;
  const link = `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${ll(seq[0])}&destination=${ll(seq.at(-1))}` +
               (seq.length > 2 ? `&waypoints=${seq.slice(1, -1).map(ll).join("|")}` : "");
  const kmT = best.out.reduce((a, r) => a + r.km, 0), mv = best.out.reduce((a, r) => a + r.tr, 0);
  S.plan = { n: "", date: todayISO, title: `Bắt đầu ${hm(t0)}, mỗi chỗ ngồi khoảng ${STAY} phút`, from: me, to: null, stops, legs,
             km: dist(kmT), drive: `${Math.round(mv)} phút`, link, back: null };
  S.mode = "plan"; S.sel = null; render(true);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pick]");
  if (b) { e.stopPropagation(); togglePick(b.dataset.pick); }
}, true);

// ---------------------------------------------------------------- bottom sheet (0 = full, 1 = half, 2 = peek)
let sheetPos = 1;
const HALF = 0.46;
function sheetY(pos) {
  const h = $("#sheet").offsetHeight;
  return [0, h - innerHeight * HALF, h - $("#grab").offsetHeight - 6][pos];
}
function setSheet(pos) {
  sheetPos = pos;
  if (innerWidth >= 900) return;
  $("#sheet").style.transform = `translateY(${sheetY(pos)}px)`;
}
function initSheet() {
  const sh = $("#sheet"), grab = $("#grab");
  let y0 = 0, t0 = 0, base = 0, moved = false;
  grab.addEventListener("pointerdown", e => { y0 = e.clientY; base = sheetY(sheetPos); t0 = Date.now(); moved = false; sh.classList.add("drag"); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointermove", e => {
    if (!sh.classList.contains("drag")) return;
    const dy = e.clientY - y0; if (Math.abs(dy) > 4) moved = true;
    sh.style.transform = `translateY(${Math.max(0, base + dy)}px)`;
  });
  grab.addEventListener("pointerup", e => {
    sh.classList.remove("drag");
    const dy = e.clientY - y0, v = dy / Math.max(1, Date.now() - t0);
    if (!moved) { setSheet(sheetPos === 2 ? 1 : sheetPos === 1 ? 0 : 1); return; }
    const y = base + dy;
    if (v > 0.5) setSheet(Math.min(2, sheetPos + 1));
    else if (v < -0.5) setSheet(Math.max(0, sheetPos - 1));
    else setSheet([0, 1, 2].reduce((a, b) => Math.abs(sheetY(b) - y) < Math.abs(sheetY(a) - y) ? b : a));
  });
  addEventListener("resize", () => setSheet(sheetPos));
}

// ---------------------------------------------------------------- main
function render(refit = true) {
  if (S.mode === "kho" && !S.me && !S.geoAsked && geo && !S.city) { S.geoAsked = true; S.near = true; setTimeout(() => geo.trigger(), 400); }
  renderTop();
  if (S.mode === "trip" || S.mode === "plan") renderTrip(refit); else renderKho(refit);
  writeHash();
  $("#list").scrollTop = 0;
}
async function unlock() {
  const h = new URLSearchParams(location.hash.slice(1));
  let k = h.get("k");
  if (k) { localStorage.setItem("tmk", k); h.delete("k"); history.replaceState(null, "", "#" + h.toString()); }
  else k = localStorage.getItem("tmk");
  if (!k) return false;
  try {
    const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const raw = b(k.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - k.length % 4) % 4));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(ENC.iv) }, key, b(ENC.ct));
    DATA = JSON.parse(new TextDecoder().decode(pt));
    return true;
  } catch (e) { localStorage.removeItem("tmk"); return false; }
}
(async () => {
  if (!(await unlock())) {
    document.body.innerHTML = '<div style="padding:40px 24px;font-size:15px;color:#6b7280">Mở bằng link đầy đủ để xem bản đồ.</div>';
    return;
  }
  if (!readHash()) autoPick();
  $("#pick").onclick = openMenu;
  $("#menu").onclick = e => { if (e.target.id === "menu") $("#menu").classList.remove("open"); };
  initSheet();
  renderTop();
  setSheet(1);
  await initMap();
  render(true);
  // moi phut: cap nhat Dang mo / Bay gio, giu cho dang cuon
  setInterval(() => {
    const y = $("#list").scrollTop;
    if (S.mode === "trip" && curDay().date === todayISO) renderTrip(false);
    else if (S.mode === "kho") { renderKho(false); renderTop(); }
    $("#list").scrollTop = y;
  }, 60000);
})();
</script>
